# ConfigForge Doctor as a GitHub Action.
#
#   - uses: develooper1994/configforge/actions/doctor@main
#     with:
#       report: build/provenance.json
#       base: base/provenance.json     # optional: the report it replaces
#       comment: true                  # optional: on the pull request
#   - uses: develooper1994/configforge/actions/doctor@main
#     with:                            # a pull request that changes files:
#       config: |                      # the keys they changed, in a comment
#         config/**
#       comment: true                  # (checkout with fetch-depth: 0; no
#                                      # report is needed for this)
#   - uses: github/codeql-action/upload-sarif@v3
#     if: always()
#     with:
#       sarif_file: configforge-doctor.sarif
#
# Builds Doctor from this repository's sources - nothing is downloaded but
# what the checkout already fetched - lints the report and, given the
# base branch's, diffs the two: which key changes, which source would win,
# a default an upgrade moved (CFD017), a key set and never read (CFD018).
# The findings go to the log, to SARIF for code scanning, to the job's
# summary as Markdown, and, when asked, to one comment on the pull
# request that each push updates. Secrets are compared by digest and never
# shown. docs/Doctor.md has the rules.
#
# Given config (git pathspecs, one per line) on a pull request, it also
# diffs each matching file between the base and the head commit
# (configforge diff) and keeps a second comment, apart from Doctor's, that
# lists the changed keys per file: keys only, never a value.
#
# The work is run.sh, changes.sh and comment.sh beside this file, which the
# test suite runs too. The inputs reach them through the environment, never by
# being pasted into a script: a report path that came from a pull request
# is text somebody else wrote.
name: ConfigForge Doctor
description: Find configuration mistakes in a ConfigForge provenance report, and what a change moves
branding:
  icon: check-circle
  color: green

inputs:
  report:
    description: The provenance report to lint - the change's. Empty skips the lint, for a run that only has config
    required: false
    default: ""
  base:
    description: The report it replaces - the base branch's - to diff against
    required: false
    default: ""
  only-changed:
    description: With base, lint only what the change touched - true or false
    required: false
    default: "false"
  baseline:
    description: Findings already accepted, one per line ("CFD001 server.port")
    required: false
    default: ""
  severity:
    description: This project's severities ("CFD010 warning")
    required: false
    default: ""
  fail-on:
    description: The level that fails the step - error, warning, info or never
    required: false
    default: error
  sarif:
    description: Where to write the SARIF file
    required: false
    default: configforge-doctor.sarif
  summary:
    description: Write the findings to the job summary - true or false
    required: false
    default: "true"
  comment:
    description: Post the findings as one pull-request comment, updated on each push - true or false
    required: false
    default: "false"
  github-token:
    description: The token for the comment; it needs pull-requests write
    required: false
    default: ${{ github.token }}
  comment-author:
    description: The login github-token comments as - only a comment by this account is taken for Doctor's and updated. Empty asks the token, and the workflow's own token is github-actions[bot]
    required: false
    default: ""
  config:
    description: Path patterns (git pathspecs, one per line) of configuration files; on a pull request their changed keys go to a comment, apart from Doctor's. Needs a checkout with fetch-depth 0
    required: false
    default: ""
  base-sha:
    description: The base commit the config files are compared with
    required: false
    default: ${{ github.event.pull_request.base.sha }}
  show-values:
    description: Show the reports' values in the log, the summary and the comment - true or false; a secret's is never shown
    required: false
    default: "false"

outputs:
  sarif:
    description: The SARIF file written
    value: ${{ inputs.sarif }}
  markdown:
    description: The findings as Markdown
    value: ${{ steps.doctor.outputs.markdown }}

runs:
  using: composite
  steps:
    - name: Build Doctor
      shell: bash
      env:
        CF_SRC: ${{ github.action_path }}/../..
        CF_BUILD: ${{ runner.temp }}/cf-doctor
      run: |
        cmake -S "$CF_SRC" -B "$CF_BUILD" -DCMAKE_BUILD_TYPE=Release \
          -DCF_BUILD_TESTING=OFF -DCF_BUILD_EXAMPLES=OFF -DCF_ENABLE_GATES=OFF
        cmake --build "$CF_BUILD" --target doctor configforge_diff --config Release --parallel
    - name: Lint and diff
      id: doctor
      if: inputs.report != ''
      shell: bash
      env:
        CF_BUILD: ${{ runner.temp }}/cf-doctor
        CF_REPORT: ${{ inputs.report }}
        CF_BASE: ${{ inputs.base }}
        CF_ONLY_CHANGED: ${{ inputs.only-changed }}
        CF_BASELINE: ${{ inputs.baseline }}
        CF_SEVERITY: ${{ inputs.severity }}
        CF_FAIL_ON: ${{ inputs.fail-on }}
        CF_SARIF: ${{ inputs.sarif }}
        CF_MARKDOWN: ${{ runner.temp }}/configforge-doctor.md
        CF_SUMMARY: ${{ inputs.summary }}
        CF_SHOW_VALUES: ${{ inputs.show-values }}
        CF_ACTION: ${{ github.action_path }}
      run: |
        CF_DOCTOR="$(find "$CF_BUILD" -type f \( -name configforge-doctor -o -name configforge-doctor.exe \) | head -n 1)"
        export CF_DOCTOR
        echo "markdown=$CF_MARKDOWN" >>"$GITHUB_OUTPUT"
        rc=0
        bash "$CF_ACTION/run.sh" || rc=$?
        if [ "$CF_SUMMARY" = "true" ] && [ -f "$CF_MARKDOWN" ]; then
          cat "$CF_MARKDOWN" >>"$GITHUB_STEP_SUMMARY"
        fi
        exit "$rc"
    - name: Comment on the pull request
      if: always() && inputs.report != '' && inputs.comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CF_REPO: ${{ github.repository }}
        CF_PR: ${{ github.event.pull_request.number }}
        CF_MARKDOWN: ${{ runner.temp }}/configforge-doctor.md
        CF_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        CF_ACTION: ${{ github.action_path }}
      run: |
        if [ -f "$CF_MARKDOWN" ]; then bash "$CF_ACTION/comment.sh"; fi
    - name: Changed configuration
      id: changes
      if: inputs.config != ''
      shell: bash
      env:
        CF_BUILD: ${{ runner.temp }}/cf-doctor
        CF_FILES: ${{ inputs.config }}
        CF_BASE_SHA: ${{ inputs.base-sha }}
        CF_MARKDOWN: ${{ runner.temp }}/configforge-changes.md
        CF_SUMMARY: ${{ inputs.summary }}
        CF_ACTION: ${{ github.action_path }}
      run: |
        CF_DIFF="$(find "$CF_BUILD" -type f \( -name configforge-diff -o -name configforge-diff.exe \) | head -n 1)"
        export CF_DIFF
        bash "$CF_ACTION/changes.sh"
        if [ "$CF_SUMMARY" = "true" ] && [ -f "$CF_MARKDOWN" ]; then
          cat "$CF_MARKDOWN" >>"$GITHUB_STEP_SUMMARY"
        fi
    - name: Comment the changed keys on the pull request
      if: always() && inputs.config != '' && inputs.comment == 'true' && github.event.pull_request.number != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        CF_REPO: ${{ github.repository }}
        CF_PR: ${{ github.event.pull_request.number }}
        CF_MARKDOWN: ${{ runner.temp }}/configforge-changes.md
        CF_MARKER: "<!-- configforge-changes -->"
        CF_COMMENT_AUTHOR: ${{ inputs.comment-author }}
        CF_ACTION: ${{ github.action_path }}
      run: |
        if [ -f "$CF_MARKDOWN" ]; then bash "$CF_ACTION/comment.sh"; fi
