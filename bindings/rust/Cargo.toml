[package]
name = "configforge"
version = "1.2.0"
edition = "2021"
license = "Zlib"
authors = ["Mustafa Selçuk Çağlar"]
description = "ConfigForge for Rust: configuration whose every value can say why it is what it is"
links = "configforge"
build = "build.rs"
repository = "https://github.com/develooper1994/configforge"
readme = "README.md"
include = ["src/**", "build.rs", "Cargo.toml", "README.md", "LICENSE", "native/**", "examples/**"]

# No dependencies, on purpose: a build that downloads nothing, as every
# other build of this project is (CONTRIBUTING.md, "Safety"). The library is
# built by build.rs with CMake. scripts/package-rust.cmake stages the
# native sources and examples inside the crate before cargo packages it.
[dependencies]

[lib]
path = "src/lib.rs"

# The examples are the C ones in Rust, kept beside them (examples/rust)
# and checked by the suite for the same lines.
[[example]]
name = "tier0"
path = "../../examples/rust/tier0.rs"

[[example]]
name = "layers"
path = "../../examples/rust/layers.rs"

[[example]]
name = "mistakes"
path = "../../examples/rust/mistakes.rs"

[[example]]
name = "runtime"
path = "../../examples/rust/runtime.rs"

[[example]]
name = "references"
path = "../../examples/rust/references.rs"

[[example]]
name = "flags"
path = "../../examples/rust/flags.rs"

[[example]]
name = "live"
path = "../../examples/rust/live.rs"
