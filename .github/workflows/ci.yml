name: ci
on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate the locales the suite needs
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
          sudo update-locale
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build both ways and compare output
        run: |
          cmake -S . -B a && cmake --build a
          cmake -S . -B b -DCF_FORCE_PORTABLE=ON -DCF_SINGLE_THREADED=ON && cmake --build b
          ./a/tests/unit/test_numeric > a.txt
          ./b/tests/unit/test_numeric > b.txt
          diff a.txt b.txt

  matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B build
      # The configuration is named because Visual Studio is a
      # multi-config generator: without -C, ctest on Windows finds every
      # test "not available" and runs none of them.
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure
      # The same driver a contributor runs, on the platform that would
      # otherwise have no way to run it.
      - run: cmake -DMODE=quick -P scripts/verify.cmake

  # A shared library on every system: a DLL exports only what CF_API
  # marks, and everywhere else -fvisibility=hidden keeps the internals
  # out of the dynamic symbol table. Every test links the shared build.
  shared:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cmake -S . -B bs -DBUILD_SHARED_LIBS=ON
      - run: cmake --build bs --config Debug
      - run: ctest --test-dir bs -C Debug --output-on-failure

  # The kqueue change handle, on a machine that is not a BSD: libkqueue
  # emulates kqueue on Linux, so the macOS and BSD path is compiled and
  # run on every commit rather than only where a Mac is in the matrix.
  # Unit tests only: the gates link the library by hand and would need
  # -lkqueue taught to each of them, for a build nobody ships.
  kqueue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y libkqueue-dev
      - run: cmake -S . -B bk -DCF_WAKE_KQUEUE=ON
      - run: cmake --build bk
      - run: ctest --test-dir bk -R "^unit\." --output-on-failure

  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset minimal && cmake --build --preset minimal
      - run: ctest --preset minimal

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset sanitize && cmake --build --preset sanitize
      - run: ctest --preset sanitize

  # The packages, built by their package managers from this checkout
  # and used by a project that knows only the package.
  conan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install conan
      - run: conan profile detect
      - run: conan create . --build=missing -tf packaging/conan/test_package
      - run: >-
          conan create . --build=missing -o "configforge/*:shared=True"
          -tf packaging/conan/test_package

  vcpkg:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - run: >-
          "$RUNNER_TEMP/vcpkg/vcpkg" install configforge
          --overlay-ports=packaging/vcpkg --x-install-root="$RUNNER_TEMP/installed"
      - run: |
          cmake -S packaging/conan/test_package -B "$RUNNER_TEMP/consumer" \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/installed"
          cmake --build "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/package_test"

  # The library needs a C89 compiler and a C library, and not a particular
  # one of either: musl through musl-gcc, the Tiny C Compiler and the
  # Portable C Compiler, besides GCC, Clang and MSVC above.
  compilers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools tcc pcc
      - run: cmake -DEXTRA=compilers -DMODE=quick -DJOBS=4 -P scripts/verify.cmake

  # musl as a distribution ships it, rather than musl-gcc over glibc's
  # tools: the same environment the release's static Linux build uses,
  # and its optimisation. CMake's Release is -O3, where Alpine's gcc
  # inlines differently from Ubuntu's: Doctor's main once grew past the
  # stack budget there and nowhere else.
  alpine:
    runs-on: ubuntu-latest
    container: alpine:3.20
    steps:
      - run: apk add --no-cache build-base cmake ninja git python3
      - uses: actions/checkout@v7
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # YAML, XML and the SQLite store are off by default because they link
  # libyaml, expat and sqlite3; this is the build that has them, the
  # whole suite included.
  yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y libyaml-dev libexpat1-dev libsqlite3-dev
      - run: >-
          cmake -S . -B build -DCF_WITH_YAML=ON -DCF_WITH_XML=ON -DCF_WITH_SQLITE=ON &&
          cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # The threading contract (D-14) under a race detector. The runner's
  # kernel randomises mmap with more bits than the thread sanitiser's
  # shadow layout allows, so the tests run with randomisation off.
  tsan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cmake --preset tsan && cmake --build --preset tsan
      - run: setarch "$(uname -m)" -R ctest --preset tsan

  # Coverage-guided fuzzing of every reader of untrusted bytes, a minute
  # each. A finding leaves its input as crash-<hash>, kept as an artifact.
  libfuzzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # What earlier runs learned: a new cache entry each run, restored
      # from the latest, so the corpus moves forward and never backward.
      - uses: actions/cache@v4
        with:
          path: build-fuzz/tests/fuzz/corpus_*
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: cmake -DEXTRA=fuzz -DFUZZ_SECONDS=60 -DMODE=quick -DJOBS=4 -P scripts/verify.cmake
      # Minimised before it is saved: only the inputs that still reach
      # something no other input does, so the cache does not grow with
      # every run.
      - name: Minimise the corpus
        if: success()
        run: |
          cd build-fuzz/tests/fuzz
          for c in corpus_*; do
            r="${c#corpus_}"
            mkdir -p "min_$r"
            ./"fuzz_$r" -merge=1 "min_$r" "$c" > /dev/null 2>&1 && rm -rf "$c" && mv "min_$r" "$c"
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-findings
          path: build-fuzz/tests/fuzz/crash-*

  # Which lines no test reaches, and a floor under the number: a ratchet
  # in verify.cmake (COVERAGE_MIN), raised as tests are added.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y gcovr
      - run: cmake -DEXTRA=coverage -DMODE=quick -DJOBS=4 -P scripts/verify.cmake

  # The Doctor action, used the way a project would use it, on a report
  # the fixtures generator writes: a finding at info level passes when
  # the step fails on warnings, and the SARIF exists afterwards.
  doctor-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: |
          cmake -S . -B build -DCF_ENABLE_GATES=OFF
          cmake --build build --target doctor_fixtures
          cd build/tests/doctor && ./doctor_fixtures
      - id: doctor
        uses: ./actions/doctor
        with:
          report: build/tests/doctor/cf_fx_staging.json
          fail-on: warning
      - run: test -s "${{ steps.doctor.outputs.sarif }}"

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: cmake --preset analyze && cmake --build --preset analyze
      - run: ctest --preset analyze

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate locales
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
          sudo update-locale
      # The suite runs one fixed seed so that a failure is reproducible.
      # Here it gets fresh ones under the sanitiser, which is where a
      # read one byte past the end is a report rather than a pass. A
      # failing seed is printed and goes straight into the suite.
      - name: Fuzz with fresh seeds
        run: |
          cmake --preset sanitize && cmake --build --preset sanitize
          for i in $(seq 1 25); do
            seed=$(( (RANDOM << 16) ^ RANDOM ^ $(date +%s) ^ i ))
            ./build-sanitize/tests/unit/test_fuzz "$seed" || exit 1
          done

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang clang-tidy clang-format
      # A second compiler is the cheapest portability test there is, and
      # it found GCC-only warning flags being handed to every compiler
      # before any clang user did.
      - name: Build and test with clang
        run: |
          cmake -S . -B bclang -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build bclang
          ctest --test-dir bclang --output-on-failure
      - name: clang-tidy
        run: |
          cmake -S . -B btidy -DCF_CLANG_TIDY=ON
          cmake --build btidy
      - name: clang-format
        run: |
          cmake -S . -B bfmt
          ctest --test-dir bfmt -R gate.format --output-on-failure
