name: ci
# bench-history is a branch of this repository that CI writes the benchmark's
# numbers to (D-111): its commits must not run the suite.
on:
  push:
    branches-ignore: [bench-history]
  pull_request: {}

# Every job reads the repository and nothing else; the one that comments
# on a pull request asks for that itself.
permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate the locales the suite needs
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
          sudo update-locale
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  portable:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build both ways and compare output
        run: |
          cmake -S . -B a && cmake --build a
          cmake -S . -B b -DCF_FORCE_PORTABLE=ON -DCF_SINGLE_THREADED=ON && cmake --build b
          ./a/lib/numeric/tests/test_numeric > a.txt
          ./b/lib/numeric/tests/test_numeric > b.txt
          diff a.txt b.txt

  matrix:
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build
      # The configuration is named because Visual Studio is a
      # multi-config generator: without -C, ctest on Windows finds every
      # test "not available" and runs none of them.
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure
      # The same driver a contributor runs, on the platform that would
      # otherwise have no way to run it.
      - run: cmake -DMODE=quick -P scripts/verify.cmake

  # A shared library on every system: a DLL exports only what CF_API
  # marks, and everywhere else -fvisibility=hidden keeps the internals
  # out of the dynamic symbol table. Every test links the shared build.
  shared:
    strategy:
      matrix:
        os: [ubuntu-26.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B bs -DBUILD_SHARED_LIBS=ON
      - run: cmake --build bs --config Debug
      - run: ctest --test-dir bs -C Debug --output-on-failure
      - name: Build source packages and test installed bindings
        shell: bash
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: "2"
          CARGO_BUILD_JOBS: "2"
        run: |
          python -m venv "$RUNNER_TEMP/python-package-env"
          if [ "$RUNNER_OS" = "Windows" ]; then
            py="$RUNNER_TEMP/python-package-env/Scripts/python.exe"
          else
            py="$RUNNER_TEMP/python-package-env/bin/python"
          fi
          "$py" -m pip install build "scikit-build-core>=0.10"
          "$py" -m build --no-isolation --outdir "$RUNNER_TEMP/python-dist"
          "$py" -m pip install --no-index --no-deps "$RUNNER_TEMP"/python-dist/*.whl
          "$py" -I tests/python/test_package.py
          cmake "-DWORK=$RUNNER_TEMP/rust-package" -P scripts/release/package_rust.cmake

  # Each component of lib/ built alone, `cmake -S lib/<c>`, with only what
  # its declaration names, and its own tests run (D-100): the proof that
  # each one can be taken out by a copy. Not a ctest gate, since nine
  # configures are too slow for every build; verify's EXTRA=components is
  # the same loop.
  components:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate the locales the suite needs
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
          sudo update-locale
      - name: Build and test each component alone
        run: |
          set -e
          for dir in lib/*/; do
            c=$(basename "$dir")
            [ -f "lib/$c/CMakeLists.txt" ] || continue
            echo "::group::$c"
            cmake -S "lib/$c" -B "$RUNNER_TEMP/components/$c" -DBUILD_TESTING=ON
            cmake --build "$RUNNER_TEMP/components/$c"
            ctest --test-dir "$RUNNER_TEMP/components/$c" --output-on-failure
            echo "::endgroup::"
          done

  # macOS's user defaults (W3-F2c): the one source only a Mac can read,
  # built with its option and tested against values `defaults import`
  # writes.
  macos-preferences:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B bp -DCF_WITH_PREFERENCES=ON
      - run: cmake --build bp
      - run: ctest --test-dir bp --output-on-failure

  # The kqueue change handle, on a machine that is not a BSD: libkqueue
  # emulates kqueue on Linux, so the macOS and BSD path is compiled and
  # run on every commit rather than only where a Mac is in the matrix.
  # Unit tests only: the gates link the library by hand and would need
  # -lkqueue taught to each of them, for a build nobody ships.
  # On 24.04, because libkqueue left Ubuntu's archive in 26.04 - and so
  # also the job that keeps the previous LTS, its GCC 13 among them, in
  # the matrix.
  kqueue:
    runs-on: ubuntu-24.04
    # A test that hangs under libkqueue held a run for hours (2026-11-20).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y libkqueue-dev
      - run: cmake -S . -B bk -DCF_WAKE_KQUEUE=ON
      - run: cmake --build bk
      - run: ctest --test-dir bk -R "^unit\." --output-on-failure

  minimal:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake --preset minimal && cmake --build --preset minimal
      - run: ctest --preset minimal

  sanitize:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake --preset sanitize && cmake --build --preset sanitize
      - run: ctest --preset sanitize

  # The packages, built by their package managers from this checkout
  # and used by a project that knows only the package.
  conan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: pipx install conan
      - run: conan profile detect
      - run: conan create . --build=missing -tf packaging/conan/test_package
      - run: >-
          conan create . --build=missing -o "configforge/*:shared=True"
          -tf packaging/conan/test_package

  vcpkg:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git "$RUNNER_TEMP/vcpkg"
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
      - run: >-
          "$RUNNER_TEMP/vcpkg/vcpkg" install configforge
          --overlay-ports=packaging/vcpkg --x-install-root="$RUNNER_TEMP/installed"
      - run: |
          cmake -S packaging/conan/test_package -B "$RUNNER_TEMP/consumer" \
            -DCMAKE_TOOLCHAIN_FILE="$RUNNER_TEMP/vcpkg/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_INSTALLED_DIR="$RUNNER_TEMP/installed"
          cmake --build "$RUNNER_TEMP/consumer"
          "$RUNNER_TEMP/consumer/package_test"

  # The library needs a C89 compiler and a C library, and not a particular
  # one of either: musl through musl-gcc, the Tiny C Compiler and the
  # Portable C Compiler, besides GCC, Clang and MSVC above.
  compilers:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools tcc pcc
      - run: cmake -DEXTRA=compilers -DMODE=quick -DJOBS=4 -P scripts/verify.cmake

  # musl as a distribution ships it, rather than musl-gcc over glibc's
  # tools: the same environment the release's static Linux build uses,
  # and its optimisation. CMake's Release is -O3, where Alpine's gcc
  # inlines differently from Ubuntu's: Doctor's main once grew past the
  # stack budget there and nowhere else.
  alpine:
    runs-on: ubuntu-26.04
    container: alpine:3.20
    steps:
      - run: apk add --no-cache build-base cmake ninja git python3
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build
      - run: ctest --test-dir build --output-on-failure

  # XML and the SQLite store are off by default because they link expat
  # and sqlite3, and YAML reads through libyaml only when asked (D-69);
  # this is the build that has them, the whole suite included.
  yaml:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: >-
          sudo apt-get update &&
          sudo apt-get install -y libyaml-dev libexpat1-dev libsqlite3-dev
      - run: >-
          cmake -S . -B build -DCF_WITH_YAML=ON -DCF_YAML_BACKEND=libyaml
          -DCF_WITH_XML=ON -DCF_WITH_SQLITE=ON &&
          cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # The same with YAML read through libfyaml (D-62): 26.04's is 0.9.4,
  # above the floor of 0.9.1 that the build enforces (24.04's 0.8 hangs
  # on malformed input, and is refused).
  libfyaml:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y libfyaml-dev
      - run: >-
          cmake -S . -B build -DCF_WITH_YAML=ON -DCF_YAML_BACKEND=libfyaml &&
          cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  # The threading contract (D-14) under a race detector. The runner's
  # kernel randomises mmap with more bits than the thread sanitiser's
  # shadow layout allows, so the tests run with randomisation off.
  tsan:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: cmake --preset tsan && cmake --build --preset tsan
      - run: setarch "$(uname -m)" -R ctest --preset tsan

  # Coverage-guided fuzzing of every reader of untrusted bytes, a minute
  # each. A finding leaves its input as crash-<hash>, kept as an artifact.
  libfuzzer:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # What earlier runs learned: a new cache entry each run, restored
      # from the latest, so the corpus moves forward and never backward.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: build-fuzz/tests/fuzz/corpus_*
          key: fuzz-corpus-${{ github.run_id }}
          restore-keys: fuzz-corpus-
      - run: cmake -DEXTRA=fuzz -DFUZZ_SECONDS=60 -DMODE=quick -DJOBS=4 -P scripts/verify.cmake
      # Minimised before it is saved: only the inputs that still reach
      # something no other input does, so the cache does not grow with
      # every run.
      - name: Minimise the corpus
        if: success()
        run: |
          cd build-fuzz/tests/fuzz
          for c in corpus_*; do
            r="${c#corpus_}"
            mkdir -p "min_$r"
            ./"fuzz_$r" -merge=1 "min_$r" "$c" > /dev/null 2>&1 && rm -rf "$c" && mv "min_$r" "$c"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: fuzz-findings
          path: build-fuzz/tests/fuzz/crash-*

  # Which lines no test reaches, and a floor under the number: a ratchet
  # in verify.cmake (COVERAGE_MIN), raised as tests are added.
  coverage:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y gcovr
      - run: cmake -DEXTRA=coverage -DMODE=quick -DJOBS=4 -P scripts/verify.cmake

  # The Doctor action, used the way a project would use it, on reports
  # the fixtures generator writes: the change diffed against the base, a
  # finding at info level passing a step that fails on warnings, and the
  # SARIF and the Markdown there afterwards. On a pull request it
  # comments, which is how the comment is tried against a real forge.
  doctor-action:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: |
          cmake -S . -B build -DCF_ENABLE_GATES=OFF
          cmake --build build --target doctor_fixtures
          cd build/tests/doctor && ./doctor_fixtures
      - id: doctor
        uses: ./actions/doctor
        with:
          report: build/tests/doctor/cf_fx_staging.json
          fail-on: warning
      - id: doctor-diff
        uses: ./actions/doctor
        with:
          report: build/tests/doctor/cf_fx_staging.json
          base: build/tests/doctor/cf_fx_prod.json
          fail-on: error
          sarif: configforge-doctor-diff.sarif
          comment: ${{ github.event_name == 'pull_request' }}
      - run: |
          test -s "${{ steps.doctor.outputs.sarif }}"
          grep -q 'ConfigForge Doctor: diff' "${{ steps.doctor-diff.outputs.markdown }}"

  analyze:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: cmake --preset analyze && cmake --build --preset analyze
      - run: ctest --preset analyze

  fuzz:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Generate locales
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
          sudo update-locale
      # The suite runs one fixed seed so that a failure is reproducible.
      # Here it gets fresh ones under the sanitiser, which is where a
      # read one byte past the end is a report rather than a pass. A
      # failing seed is printed and goes straight into the suite.
      - name: Fuzz with fresh seeds
        run: |
          cmake --preset sanitize && cmake --build --preset sanitize
          for i in $(seq 1 25); do
            seed=$(( (RANDOM << 16) ^ RANDOM ^ $(date +%s) ^ i ))
            ./build-sanitize/lib/config/tests/test_fuzz "$seed" || exit 1
          done

  # The benchmark is built and run, so it keeps working between the times
  # its numbers are taken (docs/Performance.md); CI's timings are not
  # compared, a shared runner's are not a measurement.
  bench:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and run the benchmark
        run: |
          cmake -S . -B bbench -DCMAKE_BUILD_TYPE=Release -DCF_BUILD_BENCH=ON
          cmake --build bbench --target cf_bench
          bbench/bench/cf_bench docs

  # The gate on instructions (P-1b, D-111): ConfigForge's own readers on the
  # documents of bench/compare/, 4 MiB each, one parse under callgrind. It
  # fails a change that makes a format's read cost more than 110% of
  # bench/baseline/instructions.json; wall time never gates, a shared runner
  # varies by tens of percent. Nothing is fetched: bench/compare/ builds
  # ConfigForge alone without CF_BENCH_LIBS. The results are the artifact the
  # baseline is taken from (scripts/bench/gate.py --write) and the point
  # .github/workflows/bench.yml adds to the branch bench-history.
  bench-gate:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install valgrind and expat
        run: sudo apt-get update && sudo apt-get install -y valgrind libexpat1-dev
      - name: Build the benchmark that makes the documents
        run: |
          cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DCF_BUILD_BENCH=ON
          cmake --build build-bench --target cf_bench
      - name: The gate's own tests
        run: python3 -m unittest scripts/bench/test_gate.py
      - name: Build the comparison, ConfigForge alone
        run: |
          cmake -S bench/compare -B build-cfb -DCMAKE_BUILD_TYPE=Release
          cmake --build build-cfb --target cfb_compare
      - name: The quick run
        run: >-
          python3 scripts/bench/run.py --scope quick --build build-cfb
          --cfbench build-bench/bench/cf_bench --out bench-quick.json
      - name: The gate
        run: python3 scripts/bench/gate.py bench-quick.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: bench-quick
          path: bench-quick.json
          retention-days: 14

  # The comparison builds and its adapters work, when something they are
  # made of changed (scripts/bench/changed.py): every library fetched at its
  # pinned commit (cached, keyed on the pins), every adapter through the
  # probe and touch checks, and one speed run of `mixed`. It costs nothing on
  # a push that touches none of it.
  bench-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Did the comparison change
        id: changed
        run: python3 scripts/bench/changed.py --before "${{ github.event.before }}"
      - name: Install valgrind and expat
        if: steps.changed.outputs.run == 'true'
        run: sudo apt-get update && sudo apt-get install -y valgrind libexpat1-dev
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: steps.changed.outputs.run == 'true'
        with:
          path: ~/cfb-libs
          key: cfb-libs-${{ hashFiles('bench/compare/libraries.cmake') }}
      - name: Fetch the libraries at their pinned commits
        if: steps.changed.outputs.run == 'true'
        run: cmake -DLIBS="$HOME/cfb-libs" -P scripts/bench/fetch.cmake
      - name: Build the benchmark that makes the documents
        if: steps.changed.outputs.run == 'true'
        run: |
          cmake -S . -B build-bench -DCMAKE_BUILD_TYPE=Release -DCF_BUILD_BENCH=ON
          cmake --build build-bench --target cf_bench
      - name: Build the whole comparison
        if: steps.changed.outputs.run == 'true'
        run: |
          cmake -S bench/compare -B build-cfb -DCMAKE_BUILD_TYPE=Release \
            -DCF_BENCH_LIBS="$HOME/cfb-libs" -DCF_BENCH_CFBENCH="$PWD/build-bench/bench/cf_bench"
          cmake --build build-cfb --parallel
      - name: The probes and the touch check
        if: steps.changed.outputs.run == 'true'
        run: ctest --test-dir build-cfb --output-on-failure
      - name: One speed run of mixed, every library
        if: steps.changed.outputs.run == 'true'
        run: >-
          python3 scripts/bench/run.py --scope full --sizes 1 --reps 3 --mixed-only
          --build build-cfb --cfbench build-bench/bench/cf_bench --out bench-smoke.json

  clang:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: sudo apt-get update && sudo apt-get install -y clang clang-tidy clang-format
      # A second compiler is the cheapest portability test there is, and
      # it found GCC-only warning flags being handed to every compiler
      # before any clang user did.
      - name: Build and test with clang
        run: |
          cmake -S . -B bclang -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build bclang
          ctest --test-dir bclang --output-on-failure
      - name: clang-tidy
        run: |
          cmake -S . -B btidy -DCF_CLANG_TIDY=ON
          cmake --build btidy
      - name: clang-format
        # The one major version the gate accepts (ConfigForgeClangFormat),
        # pinned as setup.sh pins it; Ubuntu's 18 lays some code out
        # differently and would only be skipped.
        run: |
          python3 -m venv "$RUNNER_TEMP/cft"
          "$RUNNER_TEMP/cft/bin/pip" install --quiet clang-format==22.1.8
          export PATH="$RUNNER_TEMP/cft/bin:$PATH"
          cmake -S . -B bfmt
          ctest --test-dir bfmt -R gate.format --output-on-failure

  # The other languages' checkers: shell, Python, the workflows and the
  # spelling, each as a gate test, at the versions setup.sh pins.
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned checkers
        run: |
          python3 -m venv "$RUNNER_TEMP/lint"
          "$RUNNER_TEMP/lint/bin/pip" install --quiet shellcheck-py==0.11.0.1 \
            ruff==0.17.6 actionlint-py==1.7.12.25 codespell==2.4.3
      - name: Install lychee
        # The release binary setup.sh pins, checked against its checksum.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/lychee.tgz" https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/lychee-x86_64-unknown-linux-musl.tar.gz
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $RUNNER_TEMP/lychee.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/lychee.tgz" -C "$RUNNER_TEMP" --strip-components=1 lychee-x86_64-unknown-linux-musl/lychee
          mv "$RUNNER_TEMP/lychee" "$RUNNER_TEMP/lint/bin/lychee"
      - name: shellcheck, ruff, actionlint, codespell, links
        run: |
          export PATH="$RUNNER_TEMP/lint/bin:$PATH"
          cmake -S . -B blint
          ctest --test-dir blint -R 'gate\.(shellcheck|ruff|actionlint|codespell|links)' --output-on-failure

  # include-what-you-use on the library's sources: a header included for
  # what it does not use binds components the layering table keeps apart
  # (D-100). Only the two libraries are built, so the tests and tools are
  # not held to it. include-what-you-use is clang; -Wno-unknown-warning-option
  # keeps it from refusing the GCC-only warnings of the build's own flags.
  # iwyu's output differs by version: this job's is the judge.
  iwyu:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install include-what-you-use
        run: sudo apt-get update && sudo apt-get install -y iwyu
      - name: Build the libraries under it
        run: |
          cmake -S . -B biwyu -DCMAKE_BUILD_TYPE=Debug             "-DCMAKE_C_INCLUDE_WHAT_YOU_USE=include-what-you-use;-Xiwyu;--error;-Xiwyu;--mapping_file=${{ github.workspace }}/.iwyu.imp;-Wno-unknown-warning-option"
          cmake --build biwyu --target configforge configforge_serialize

  # What the format gate wants, as a patch. The gate reports and does not
  # rewrite, and the one version it accepts is not on every machine: a
  # tree formatted with another fails here and nowhere else. This job
  # fails with the gate and leaves the difference to be applied -
  #   gh run download <run> -n format-patch && git apply format.patch
  # - so a disagreement costs one push, not one for each line.
  format-patch:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Format with the pinned clang-format, and keep the difference
        run: |
          python3 -m venv "$RUNNER_TEMP/cft"
          "$RUNNER_TEMP/cft/bin/pip" install --quiet clang-format==22.1.8
          git ls-files -z 'lib/*.c' 'lib/*.h' 'lib/*.hpp' \
            'tools/doctor/include/configforge/*.h' 'tests/*.c' 'tests/*.cpp' \
            'tools/*.c' 'examples/*.c' 'examples/*.cpp' 'bench/*.c' \
            'bench/compare/*.cpp' 'bench/compare/*.h' \
            'bench/compare/adapters/*.cpp' 'bench/compare/size/*.cpp' |
            xargs -0 "$RUNNER_TEMP/cft/bin/clang-format" -i
          git diff > format.patch
          if [ -s format.patch ]; then
            git diff --stat
            echo "::error::the tree is not as clang-format 22.1.8 leaves it; the artifact format-patch is the difference"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: format-patch
          path: format.patch
