name: ci
on: [push, pull_request]

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the locales the suite needs
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
          sudo update-locale
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  portable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both ways and compare output
        run: |
          cmake -S . -B a && cmake --build a
          cmake -S . -B b -DCF_FORCE_PORTABLE=ON -DCF_SINGLE_THREADED=ON && cmake --build b
          ./a/tests/unit/test_numeric > a.txt
          ./b/tests/unit/test_numeric > b.txt
          diff a.txt b.txt

  matrix:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build
      # The configuration is named because Visual Studio is a
      # multi-config generator: without -C, ctest on Windows finds every
      # test "not available" and runs none of them.
      - run: cmake --build build --config Debug
      - run: ctest --test-dir build -C Debug --output-on-failure
      # The same driver a contributor runs, on the platform that would
      # otherwise have no way to run it.
      - run: cmake -DMODE=quick -P scripts/verify.cmake

  # The kqueue change handle, on a machine that is not a BSD: libkqueue
  # emulates kqueue on Linux, so the macOS and BSD path is compiled and
  # run on every commit rather than only where a Mac is in the matrix.
  # Unit tests only: the gates link the library by hand and would need
  # -lkqueue taught to each of them, for a build nobody ships.
  kqueue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libkqueue-dev
      - run: cmake -S . -B bk -DCF_WAKE_KQUEUE=ON
      - run: cmake --build bk
      - run: ctest --test-dir bk -R "^unit\." --output-on-failure

  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset minimal && cmake --build --preset minimal
      - run: ctest --preset minimal

  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset sanitize && cmake --build --preset sanitize
      - run: ctest --preset sanitize

  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y cppcheck
      - run: cmake --preset analyze && cmake --build --preset analyze
      - run: ctest --preset analyze

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate locales
        run: |
          sudo locale-gen tr_TR.UTF-8 de_DE.UTF-8
          sudo update-locale
      # The suite runs one fixed seed so that a failure is reproducible.
      # Here it gets fresh ones under the sanitiser, which is where a
      # read one byte past the end is a report rather than a pass. A
      # failing seed is printed and goes straight into the suite.
      - name: Fuzz with fresh seeds
        run: |
          cmake --preset sanitize && cmake --build --preset sanitize
          for i in $(seq 1 25); do
            seed=$(( (RANDOM << 16) ^ RANDOM ^ $(date +%s) ^ i ))
            ./build-sanitize/tests/unit/test_fuzz "$seed" || exit 1
          done

  clang:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y clang clang-tidy clang-format
      # A second compiler is the cheapest portability test there is, and
      # it found GCC-only warning flags being handed to every compiler
      # before any clang user did.
      - name: Build and test with clang
        run: |
          cmake -S . -B bclang -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build bclang
          ctest --test-dir bclang --output-on-failure
      - name: clang-tidy
        run: |
          cmake -S . -B btidy -DCF_CLANG_TIDY=ON
          cmake --build btidy
      - name: clang-format
        run: |
          cmake -S . -B bfmt
          ctest --test-dir bfmt -R gate.format --output-on-failure
