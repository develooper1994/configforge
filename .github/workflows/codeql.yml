# Code scanning: GitHub's CodeQL over the C and C++ library and tools,
# the Python and Rust bindings and these workflows, on every push and
# pull request to main and once a week, with the findings under the
# repository's Security tab.
#
# C and C++ are analysed without a build (build-mode none): the build
# and its sanitisers, analyzers and tidy run in ci.yml already, and a
# second build here would only repeat them.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [c-cpp, python, rust, actions]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
