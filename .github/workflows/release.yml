# A release, built from a tag:
#
#   git tag -a v0.2.0 -m "ConfigForge 0.2.0" && git push origin v0.2.0
#
# Every artifact is built by the suite's own build and tested before it
# is packaged, and published with a SHA256SUMS beside it:
#
#   configforge-<v>-amalgamation.tar.gz    two files and the licence: no build system
#   configforge-<v>-linux-x86_64-musl.tar.gz  the tools, the library, headers, SBOM
#   configforge-<v>-linux-x86_64-musl.spdx.json  that SBOM, a file of its own
#   configforge-<v>-windows-x64.zip        the same, built with MSVC
#   configforge-<v>-macos-arm64.tar.gz     the same, built with Apple's clang
#
# GitHub supplies the source zip and tar archives for the tag.
#
# The Linux build is musl, in Alpine, linked statically: one Doctor
# binary that runs on any Linux with no library beside it, and a library
# that is the same code a glibc build is - the suite runs against both.
name: release

on:
  push:
    tags: ["v*"]
    # A dry run - every artifact built and tested, nothing published -
    # whenever what the release builds changes, so a release does not
    # find out on the day of its tag (1.3.0 did: a Doctor test with no
    # binary in the Windows build).
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - CMakeLists.txt
      - cmake/**
      - scripts/release/linux_musl.sh
      - tools/**
      - tests/doctor/**
      - tests/front/**
  workflow_dispatch:

# The build jobs read the repository; only `publish` writes, and asks for
# that itself.
permissions:
  contents: read

jobs:
  # A tag that disagrees with the tree is refused before anything is
  # built: the version cf_version.h says, and a CHANGELOG section for it
  # that no longer says "unreleased".
  check:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tag, the build and the CHANGELOG agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          v="${v//\//-}"
          built=$(cmake -P scripts/release/version.cmake)
          [ "$built" = "$v" ] || { echo "tag $v, cf_version.h says $built"; exit 1; }
          head=$(grep -E "^## $v( |$)" CHANGELOG.md || true)
          [ -n "$head" ] || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          case "$head" in *unreleased*) echo "CHANGELOG.md still says: $head"; exit 1 ;; esac

  amalgamation:
    needs: check
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Amalgamation
        run: |
          v="${GITHUB_REF_NAME#v}"
          v="${v//\//-}"
          mkdir -p dist
          python3 scripts/generate/amalgamate.py . "amalgamation/configforge-$v"
          cp LICENSE "amalgamation/configforge-$v/"
          tar -C amalgamation -czf "dist/configforge-$v-amalgamation.tar.gz" "configforge-$v"
          # Not a build: one C file, so there is no cache to read.
          cat > dist/buildinfo-amalgamation.md <<'EOF'
          ### amalgamation

          The amalgamation: one C file, every option in `cf_build_options.h` at its default.
          EOF
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: amalgamation, path: dist/* }

  linux-musl:
    needs: check
    runs-on: ubuntu-26.04
    container: alpine:3.20
    steps:
      - run: apk add --no-cache build-base cmake ninja git python3 tar
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source-a
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source-second
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build, test and compare both archives
        run: |
          set -eu
          source_a="$GITHUB_WORKSPACE/source-a"
          source_second="$GITHUB_WORKSPACE/source-second"
          test "$(git -C "$source_a" rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C "$source_second" rev-parse HEAD)" = "$GITHUB_SHA"
          v=$(cd "$source_a" && cmake -P scripts/release/version.cmake)
          SOURCE_DATE_EPOCH=$(git -C "$source_a" show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH TZ=UTC LC_ALL=C
          umask 022
          work=$(mktemp -d)
          trap 'rm -rf "$work"' EXIT

          # Linked statically, the tools carry musl, whose MIT licence asks
          # for its notice in every copy; Alpine does not ship the text,
          # so it comes from musl's own repository, at the version used.
          m=$(apk info musl | sed -n '1s/^musl-\([0-9.]*\)-r.*/\1/p')
          notice="$work/musl-COPYRIGHT"
          wget -q -O "$notice" "https://git.musl-libc.org/cgit/musl/plain/COPYRIGHT?h=v$m"
          grep -q "MIT license" "$notice"

          sh "$source_a/scripts/release/linux_musl.sh" \
            "$source_a" "$work/a" "$v" "$notice"
          sh "$source_second/scripts/release/linux_musl.sh" \
            "$source_second" "$work/second" "$v" "$notice"

          archive="configforge-$v-linux-x86_64-musl.tar.gz"
          if ! cmake -E compare_files "$work/a/$archive" "$work/second/$archive"; then
            cmake -E sha256sum "$work/a/$archive" "$work/second/$archive"
            diff -qr "$work/a/stage" "$work/second/stage" || true
            exit 1
          fi
          mkdir -p dist
          cp "$work/a/$archive" dist/
          # The SBOM beside the archive, so it is attested and listed in
          # SHA256SUMS like the archive: exactly one in the staged tree.
          sbom=$(find "$work/a/stage" -name configforge.spdx.json)
          [ -n "$sbom" ] && [ "$(echo "$sbom" | wc -l)" -eq 1 ] || exit 1
          cp "$sbom" "dist/configforge-$v-linux-x86_64-musl.spdx.json"
          # How this archive was built, read from the build's own cache.
          cmake -DBUILD="$work/a/build" -DNAME=linux-musl             -DOUT="$PWD/dist/buildinfo-linux-musl.md"             -P "$source_a/scripts/release/buildinfo.cmake"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: linux-musl, path: dist/* }

  windows:
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build, test, install
        shell: pwsh
        run: |
          # Without this a pwsh step fails only on its last command's exit
          # code, and a failing ctest in the middle would ship.
          $PSNativeCommandUseErrorActionPreference = $true
          $v = ($env:GITHUB_REF_NAME -creplace '^v', '') -replace '/', '-'
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX="$PWD/stage/configforge-$v"
          cmake --build build --config Release
          ctest --test-dir build -C Release --output-on-failure
          cmake --install build --config Release
          # The library keeps the DLL runtime (/MD), which is what a program
          # linking it expects. Doctor is built again on its own with the
          # static one (/MT): the /MD build needs VCRUNTIME140.dll, which a
          # clean Windows does not have, and this one needs only KERNEL32.
          # Its own tests run against the binary that ships.
          cmake -S . -B build-doctor -DCMAKE_POLICY_DEFAULT_CMP0091=NEW `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          # The whole tree, not a list of targets: a list missed doctor_gen
          # when its test was added, and the release failed on its tag.
          cmake --build build-doctor --config Release
          ctest --test-dir build-doctor -C Release -R "^(doctor|front)\." --output-on-failure
          New-Item -ItemType Directory -Force "stage/configforge-$v/bin" | Out-Null
          Copy-Item build-doctor/tools/bin/Release/*.exe "stage/configforge-$v/bin/"
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "stage/configforge-$v" -DestinationPath "dist/configforge-$v-windows-x64.zip"
          # The library's build, the one the archive's headers and library came from.
          cmake -DBUILD=build -DNAME=windows -DOUT="$PWD/dist/buildinfo-windows.md" `
            -P scripts/release/buildinfo.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: windows, path: dist/* }

  macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build, test, install
        run: |
          v="${GITHUB_REF_NAME#v}"
          v="${v//\//-}"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/stage/configforge-$v"
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure
          cmake --install build
          mkdir -p "stage/configforge-$v/bin"
          for p in configforge configforge-doctor; do
            install -s -m 755 "build/tools/bin/$p" "stage/configforge-$v/bin/$p"
          done
          mkdir -p dist
          tar -C stage -czf "dist/configforge-$v-macos-arm64.tar.gz" "configforge-$v"
          cmake -DBUILD=build -DNAME=macos -DOUT="$PWD/dist/buildinfo-macos.md"             -P scripts/release/buildinfo.cmake
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: macos, path: dist/* }

  publish:
    needs: [amalgamation, linux-musl, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    # The attestation below: a signed statement of which workflow, commit
    # and runner built each file, which `gh attestation verify <file>
    # -R develooper1994/configforge` checks.
    permissions:
      contents: write
      discussions: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with: { path: dist, merge-multiple: true }
      # The records of how each archive was built go into the notes below,
      # not onto the release as files: out of dist/ before it is attested
      # and published.
      - name: Keep the build records out of the assets
        run: |
          mkdir buildinfo
          mv dist/buildinfo-*.md buildinfo/
      - name: Provenance for every file published
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Notes, checksums, release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          v="${v//\//-}"
          # This version's section of the CHANGELOG, and nothing else.
          awk -v v="$v" '
            $0 ~ "^## " v "( |$)" { on = 1; next }
            on && /^## / { exit }
            on { print }' CHANGELOG.md > notes.md
          # How each archive was built, from the build itself (L-23).
          {
            printf '\n## How each archive was built\n\n'
            for j in linux-musl windows macos amalgamation; do
              cat "buildinfo/buildinfo-$j.md"
              printf '\n'
            done
          } >> notes.md
          (cd dist && sha256sum ./* > SHA256SUMS)
          # Each release opens its discussion under Announcements.
          gh release create "$GITHUB_REF_NAME" dist/* --title "ConfigForge $v"             --notes-file notes.md --discussion-category Announcements

  # The Rust crate, published to crates.io after the GitHub release
  # exists (L-24). The token is the secret CARGO_REGISTRY_TOKEN, given to
  # the one step that publishes and nowhere else. M-22's trusted
  # publishing replaces it; the secret is then deleted. Skipped until the
  # maintainer sets the repository variable PUBLISH_CRATES to true (M-23-m):
  # crates.io refuses an account without a verified email.
  crates:
    needs: publish
    if: vars.PUBLISH_CRATES == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    environment: crates-io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tag and the build agree
        run: |
          v="${GITHUB_REF_NAME#v}"
          built=$(cmake -P scripts/release/version.cmake)
          [ "$built" = "$v" ] || { echo "tag $v, cf_version.h says $built"; exit 1; }
      - name: Stage and test the crate
        run: cmake "-DWORK=$RUNNER_TEMP/rust-package" -P scripts/release/package_rust.cmake
      - name: Publish to crates.io
        working-directory: ${{ runner.temp }}/rust-package/package
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          if curl -fsS -A configforge-release "https://crates.io/api/v1/crates/configforge/$v" > /dev/null; then
            echo "configforge $v is already on crates.io; nothing to publish"
            exit 0
          fi
          cargo publish --locked --no-verify
