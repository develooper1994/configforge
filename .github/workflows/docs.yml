name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - name: Install documentation tools
        run: |
          python -m venv "$RUNNER_TEMP/docs-env"
          "$RUNNER_TEMP/docs-env/bin/python" -m pip install -r scripts/docs/requirements.txt
      - name: Check and build the documentation
        run: |
          cmake -DSRC="$PWD" -DBIN="$RUNNER_TEMP/docs-api" -P cmake/gates/GateApiref.cmake
          "$RUNNER_TEMP/docs-env/bin/python" -m mkdocs build --strict
          "$RUNNER_TEMP/docs-env/bin/python" scripts/check/check_docs.py build/docs-site
      - uses: actions/configure-pages@v6
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/docs-site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
